<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="img/Logo.png">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Inicia Sesión</h1>

    <div class="container">

        <div class="card">

            <form>
                <label for="nombre">Ingresa tu nombre</label>
                <input type="text" name="nombre" id="nombre" required>

                <label for="correo">Ingresa tu correo</label>
                <input type="email" name="correo" id="correo" placeholder="ejemplo@gmail.com" required>
        
                <label for="contraseña">Contraseña</label>
                <input type="password" name="contraseña" id="contraseña" placeholder="Ingresa tu contraseña" required>
    
                <button type="submit">Iniciar Sesión</button>
            </form>
        
            <a href="CrearC.html" class="link">¿No tienes cuenta? Creala Aquí</a>

        </div>

    </div>


    <script>
        document.querySelector("form").addEventListener("submit", function(e){
            e.preventDefault();

            let correo = document.getElementById("correo").value;
            let pass = document.getElementById("contraseña").value;

            let guardadoCorreo = localStorage.getItem("correo");
            let guardadoPass = localStorage.getItem("pass");

            if(correo === guardadoCorreo && pass === guardadoPass){

                // GUARDAR SESIÓN
                localStorage.setItem("sesion", "activa");

                alert("Inicio de sesión correcto");

                window.location.href = "Inicio.html";

            } else {
                alert("Datos incorrectos");
            }
        });
    </script>

</body>
</html>
