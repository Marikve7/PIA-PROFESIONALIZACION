<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="icon" href="img/Logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Crea tu cuenta</h1>

    <div class="container">

        <div class="card">

            <form>
                <label for="nombre">Ingresa tu nombre</label>
                <input type="text" name="nombre" id="nombre" required>

                <label for="correo">Ingresa tu correo:</label>
                <input type="email" name="correo" id="correo" placeholder="ejemplo@gmail.com" required>
        
                <label for="contraseña">Crea una contraseña:</label>
                <input type="password" name="contraseña" id="contraseña" placeholder="Ingresa una contraseña" required>
                
                <label for="confirmar">Confirma tu contraseña:</label>
                <input type="password" name="confirmar" id="confirmar" required>

                <button type="submit">Crear cuenta</button>

                <a href="login.html" class="link">¿Ya tienes cuenta? Inicia sesión</a>
            </form>

        </div>

    </div>

    <script>
        document.querySelector("form").addEventListener("submit", function(e){
            e.preventDefault();

            let nombre = document.getElementById("nombre").value;
            let correo = document.getElementById("correo").value;
            let pass = document.getElementById("contraseña").value;
            let confirmar = document.getElementById("confirmar").value;

            if(pass !== confirmar){
                alert("Las contraseñas no coinciden");
                return;
            }

            // GUARDAR DATOS
            localStorage.setItem("nombre", nombre);
            localStorage.setItem("correo", correo);
            localStorage.setItem("pass", pass);

            alert("Cuenta creada correctamente");

            window.location.href = "login.html";
        });
    </script>


</body>
</html>
